<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NoobJerry</title>
  <meta name="description" content="Wuthering Waves boss fights, sim racing and whatever I'm playing. Videos, Instagram and links from NoobJerry.">
  <meta name="theme-color" content="#0b0b0b">
  <link rel="canonical" href="https://jerryl-creator.github.io/noobjerry-site/">
  <!-- Google Search Console ownership check (keep this, or Google stops trusting the site) -->
  <meta name="google-site-verification" content="hILNniri0AV4G8Uf2pFmomi_wlWEHCfBVkgMBgK8e_8">

  <!-- Tells Google who this page is about and links your accounts together. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ProfilePage",
    "url": "https://jerryl-creator.github.io/noobjerry-site/",
    "mainEntity": {
      "@type": "Person",
      "name": "NoobJerry",
      "alternateName": ["noob_jerryl", "sandwichjerry"],
      "description": "Wuthering Waves boss fights, sim racing and whatever I'm playing.",
      "image": "https://jerryl-creator.github.io/noobjerry-site/images/avatar.jpg",
      "sameAs": [
        "https://www.youtube.com/@noobjerry",
        "https://www.instagram.com/noob_jerryl",
        "https://www.twitch.tv/sandwichjerry"
      ]
    }
  }
  </script>

  <!-- Browser tab + phone home-screen icon -->
  <link rel="icon" type="image/png" sizes="64x64" href="images/icon-64.png">
  <link rel="apple-touch-icon" href="images/icon-180.png">

  <!-- Preview card when the link is shared (Discord, WhatsApp, X, Facebook...).
       If you move the site to your own domain, change the two URLs below. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="NoobJerry">
  <meta property="og:title" content="NoobJerry">
  <meta property="og:description" content="Wuthering Waves boss fights, sim racing and whatever I'm playing.">
  <meta property="og:url" content="https://jerryl-creator.github.io/noobjerry-site/">
  <meta property="og:image" content="https://jerryl-creator.github.io/noobjerry-site/images/share.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="NoobJerry: Wuthering Waves, sim racing and whatever I'm playing.">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    // Apply the saved theme before the page draws, so it doesn't flash.
    try {
      var t = localStorage.getItem("theme");
      if (t) document.documentElement.dataset.theme = t;
    } catch (e) {}
    // Play the pop-in intro (skipped for people who turned off animations).
    if (!matchMedia("(prefers-reduced-motion: reduce)").matches) document.documentElement.classList.add("intro");
  </script>
</head>
<body>
  <div class="grid-bg" aria-hidden="true"></div>

  <header class="nav">
    <a href="#top" class="logo" id="logo"></a>
    <nav>
      <button class="theme-toggle" id="theme-toggle" type="button"></button>
    </nav>
  </header>

  <main id="top">
    <section class="hero">
      <div class="speedlines" aria-hidden="true"></div>
      <div class="avatar" id="avatar"></div>
      <p class="kicker">// welcome to my page, just look around</p>
      <h1 id="name"></h1>
      <a class="live-badge" id="live-badge" target="_blank" rel="noopener" hidden>
        <span class="live-dot" aria-hidden="true"></span><strong>LIVE</strong><span>on Twitch</span><span class="live-meta" id="live-meta"></span><span class="live-time" id="live-time"></span>
      </a>
      <p class="tagline" id="tagline"></p>
      <p class="bio" id="bio"></p>
      <div class="social-row" id="social-row"></div>
    </section>

    <section class="featured" id="featured" hidden></section>

    <section id="content" class="section">
      <div class="section-head">
        <h2><span class="hash">#</span>content<span class="jp">コンテンツ</span></h2>
        <div class="tabs" role="tablist" aria-label="Choose content" id="tabs">
          <span class="tab-pill" id="tab-pill" aria-hidden="true"></span>
          <button class="tab" role="tab" id="tab-youtube" data-tab="youtube" aria-controls="panel-youtube" aria-selected="true"></button>
          <button class="tab" role="tab" id="tab-instagram" data-tab="instagram" aria-controls="panel-instagram" aria-selected="false" tabindex="-1"></button>
        </div>
      </div>

      <div class="panel" id="panel-youtube" role="tabpanel" aria-labelledby="tab-youtube">
        <div class="video-tools">
          <label class="search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
            <input id="video-search" type="search" placeholder="Search videos…" aria-label="Search videos" autocomplete="off">
            <kbd aria-hidden="true">/</kbd>
          </label>
          <span class="video-count" id="video-count" aria-live="polite"></span>
        </div>
        <div class="filters" id="filters" role="group" aria-label="Filter videos by tag"></div>
        <div class="video-grid" id="video-grid"></div>
        <button class="btn load-more" id="load-more" type="button" hidden></button>
      </div>

      <div class="panel" id="panel-instagram" role="tabpanel" aria-labelledby="tab-instagram" hidden>
        <div class="ig-head" id="ig-head"></div>
        <div class="ig-grid" id="ig-grid"></div>
      </div>
    </section>

    <section id="setup" class="section" hidden>
      <div class="section-head">
        <h2><span class="hash">#</span>my_setup<span class="jp">セットアップ</span></h2>
      </div>
      <div class="setup-grid" id="setup-grid"></div>
    </section>

    <section id="links" class="section">
      <div class="section-head">
        <h2><span class="hash">#</span>find_me<span class="jp">リンク</span></h2>
      </div>
      <div class="link-list" id="link-list"></div>
    </section>
  </main>

  <footer class="footer">
    <p id="footer-text"></p>
    <p class="muted">© <span id="year"></span> <span id="footer-name"></span></p>
  </footer>

  <dialog id="player" class="player">
    <button class="close" id="player-close" aria-label="Close video">✕</button>
    <div class="player-frame" id="player-frame"></div>
    <div class="player-foot"><h3 id="player-title"></h3><a id="player-link" class="player-link" target="_blank" rel="noopener" hidden></a></div>
  </dialog>

  <script src="content.js"></script>
  <script src="videos.js"></script>
  <script src="app.js"></script>
</body>
</html>
