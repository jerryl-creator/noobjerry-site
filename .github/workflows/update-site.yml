# Checks YouTube for new uploads every 3 hours and publishes the site to GitHub Pages.
# Also publishes right away whenever you change a file in the repo.
name: Update videos and publish site

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  push:
    branches: [main]
  workflow_dispatch:          # "Run workflow" button on the Actions tab

permissions:
  contents: write   # to save new videos into videos.js
  pages: write      # to publish the site
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.save.outputs.changed == 'true' || github.event_name != 'schedule' }}
    steps:
      - uses: actions/checkout@v7

      - name: Get latest videos from YouTube
        run: python3 scripts/update_videos.py

      - name: Get latest projects and changelog from GitHub
        run: python3 scripts/update_github.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save updates to the repo
        id: save
        run: |
          if git diff --quiet -- videos.js github.js; then
            echo "Nothing new from YouTube or GitHub."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add videos.js github.js
            git commit -m "Update videos and GitHub activity"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # On the 3-hourly check, only republish when there's something new.
      - name: Prepare site files
        if: steps.save.outputs.changed == 'true' || github.event_name != 'schedule'
        run: |
          mkdir _site
          cp index.html style.css app.js theme.js content.js videos.js github.js _site/
          cp -r images fonts _site/
          # Write the main content into the HTML (for search engines and no-JavaScript visitors).
          python3 scripts/prerender.py _site
          # Stamp file links with this version so browsers load fresh copies after every publish.
          v="${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}"
          sed -i -E "s/(href|src)=\"(style\.css|app\.js|theme\.js|content\.js|videos\.js|github\.js)\"/\1=\"\2?v=$v\"/g" _site/index.html
          grep -E "\?v=" _site/index.html
          # Site map for Google, dated to this publish.
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n  <url>\n    <loc>https://jerryl-creator.github.io/noobjerry-site/</loc>\n    <lastmod>%s</lastmod>\n  </url>\n</urlset>\n' "$(date -u +%Y-%m-%d)" > _site/sitemap.xml
          cat _site/sitemap.xml

      - uses: actions/configure-pages@v6
        if: steps.save.outputs.changed == 'true' || github.event_name != 'schedule'

      - uses: actions/upload-pages-artifact@v5
        if: steps.save.outputs.changed == 'true' || github.event_name != 'schedule'
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
